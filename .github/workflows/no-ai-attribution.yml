name: no-ai-attribution

# The git hooks guard the local machine. This guards everything else: a commit
# pushed from another clone, a commit made through the GitHub web editor, a PR
# title or body written by an agent, and a squash-merge message.
#
# Installed by hooks/install.sh --ci, which also vendors the guard script to
# .github/no-ai-attribution/. Both are committed files: CI must not depend on
# anything outside the repository.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          set -eu
          guard=.github/no-ai-attribution/no-ai-attribution.sh
          chmod +x "$guard"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
            git rev-parse --verify --quiet "${{ github.event.before }}" >/dev/null || range="${{ github.sha }} -1"
          fi
          status=0
          for sha in $(git rev-list $range); do
            if ! git log -1 --pretty=%B "$sha" | "$guard" scan -; then
              echo "::error::AI attribution in commit $sha"
              status=1
            fi
          done
          exit $status

      - name: Check pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          guard=.github/no-ai-attribution/no-ai-attribution.sh
          chmod +x "$guard"
          status=0
          printf '%s\n' "$PR_TITLE" | "$guard" scan - || { echo "::error::AI attribution in the PR title"; status=1; }
          printf '%s\n' "$PR_BODY"  | "$guard" scan - || { echo "::error::AI attribution in the PR body"; status=1; }
          exit $status
